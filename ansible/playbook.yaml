---
- name: L30Bola MacOs Setup
  gather_facts: true
  hosts: localhost
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    setup_home: "{{ lookup('env', 'HOME') }}"
    dotfiles_dir: "{{ playbook_dir }}/.."
    ble_sh_dir: "{{ setup_home }}/ble.sh"
    ble_sh_version: HEAD
    asdf_data_dir: "{{ lookup('env', 'ASDF_DATA_DIR') or (setup_home ~ '/.asdf') }}"
    application_icon_files:
      - name: "Visual Studio Code.app"
        icon: "{{ dotfiles_dir }}/icons/vscode.icns"
      - name: "Google Chrome.app"
        icon: "{{ dotfiles_dir }}/icons/chrome.icns"
      - name: "Spotify.app"
        icon: "{{ dotfiles_dir }}/icons/spotify.icns"
      - name: "Telegram Desktop.app"
        icon: "{{ dotfiles_dir }}/icons/telegram.icns"
    asdf_tool_versions:
      fzf: latest
      golang: latest
      helm: latest
      kubectl: "1.34.4"
      sops: latest
      python: latest
  environment:
    PATH: "{{ asdf_data_dir }}/shims:{{ lookup('env', 'PATH') }}"
  tasks:
    - name: Update Homebrew
      community.general.homebrew:
        update_homebrew: true
      tags:
        - brew
        - homebrew
        - install

    # - name: Install Rosetta 2
    #   ansible.builtin.command:
    #     cmd: softwareupdate --install-rosetta --agree-to-license
    #   register: rosetta2
    #   changed_when: rosetta2.rc != 0
    #   tags:
    #     - rosetta2

    - name: Install packages
      community.general.homebrew:
        force_formula: true
        formula:
          - agg
          - asciinema
          - asdf
          - atuin
          - awscli
          - bash
          - bash-completion@2
          - bat
          - binutils
          - bitwarden-cli
          - calc
          - charmbracelet/tap/freeze
          - cilium-cli
          - clusterctl
          - coreutils
          - curl
          - diffutils
          - ed
          - expect
          - fastfetch
          - ffmpeg
          - file-formula
          - fileicon
          - findutils
          - gawk
          - git
          - git-delta
          - gnu-getopt
          - gnu-indent
          - gnu-sed
          - gnu-tar
          - gnu-which
          - gnupg
          - gnutls
          - gpatch
          - grep
          - gum
          - gzip
          - htop
          - hubble
          - jq
          - kind
          - kubectx
          - kubespy
          - kube-ps1
          - less
          - m4
          - make
          - openssl
          - openssh
          - pipx
          - python
          - rclone
          - rsync
          - s5cmd
          - scrcpy
          - shellcheck
          - shfmt
          - sops
          - stern
          - syncthing
          - tailscale
          - the_silver_searcher
          - tilt
          - tree
          - tmux
          - unzip
          - vim
          - watch
          - wdiff
          - wget
          - wireshark
          - yq
          - z
        state: latest
      tags:
        - brew
        - homebrew
        - packages
        - quarantine

    - name: Install cask packages
      community.general.homebrew_cask:
        name:
          - alt-tab
          - android-platform-tools
          - bartender
          - bitwarden
          - cmake-app
          - meld
          - discord
          - domzilla-caffeine
          - element
          - font-fira-code-nerd-font
          - font-fira-mono-nerd-font
          - font-inconsolata-nerd-font
          - font-roboto-mono-nerd-font
          - google-chrome
          - iterm2
          # - logi-options+
          - multitouch
          - rectangle
          - soundsource
          - spotify
          - steelseries-gg
          - telegram-desktop
          - visual-studio-code
          - winbox
        state: latest
        sudo_password: "{{ homebrew_sudo_password | default(omit) }}"
      tags:
        - brew
        - homebrew
        - casks
        - quarantine

    - name: Install NearDrop
      community.general.homebrew_cask:
        name:
          - grishka/grishka/neardrop
          # - youtype
        state: latest
        sudo_password: "{{ homebrew_sudo_password | default(omit) }}"
      tags:
        - brew
        - homebrew
        - packages
        - no-quarantine # Legacy task-selection tag; no quarantine option is passed.

    - name: Install additional casks
      community.general.homebrew_cask:
        name:
          - mos
          - maccy
        state: latest
        sudo_password: "{{ homebrew_sudo_password | default(omit) }}"
      tags:
        - brew
        - homebrew
        - casks
        - no-quarantine # Legacy task-selection tag; no quarantine option is passed.

    - name: Install asdf plugins
      ansible.builtin.command:
        argv:
          - asdf
          - plugin
          - add
          - "{{ item }}"
        creates: "{{ asdf_data_dir }}/plugins/{{ item }}"
      loop: "{{ asdf_tool_versions.keys() | list }}"
      tags:
        - asdf
        - plugins

    - name: Resolve latest asdf versions
      ansible.builtin.command:
        argv:
          - asdf
          - latest
          - "{{ item.key }}"
      register: asdf_latest_versions
      changed_when: false
      check_mode: false
      loop: "{{ asdf_tool_versions | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value == 'latest'
      tags:
        - asdf
        - global
        - versions

    - name: Install asdf versions
      ansible.builtin.command:
        argv:
          - asdf
          - install
          - "{{ item.item.key }}"
          - "{{ item.stdout | default(item.item.value) | trim }}"
        creates: "{{ asdf_data_dir }}/installs/{{ item.item.key }}/{{ item.stdout | default(item.item.value) | trim }}"
      loop: "{{ asdf_latest_versions.results }}"
      loop_control:
        label: "{{ item.item.key }} {{ item.stdout | default(item.item.value) | trim }}"
      tags:
        - asdf
        - versions

    - name: Set global asdf versions
      ansible.builtin.lineinfile:
        path: "{{ setup_home }}/.tool-versions"
        regexp: "^{{ item.item.key }}\\s+"
        line: "{{ item.item.key }} {{ item.stdout | default(item.item.value) | trim }}"
        create: true
        mode: "0644"
      loop: "{{ asdf_latest_versions.results }}"
      loop_control:
        label: "{{ item.item.key }} {{ item.stdout | default(item.item.value) | trim }}"
      tags:
        - asdf
        - global

    - name: Update Bash completion cache
      ansible.builtin.command:
        cmd: "{{ dotfiles_dir }}/bin/update-bash-completions"
      register: bash_completion_cache
      changed_when: >-
        'updated:' in bash_completion_cache.stdout or
        'removed:' in bash_completion_cache.stdout
      tags:
        - bash
        - completions

    - name: Configure keyboard repeat
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: "{{ item.key }}"
        type: int
        value: "{{ item.value }}"
      loop:
        - key: InitialKeyRepeat
          value: 11
        - key: KeyRepeat
          value: 1
      when: ansible_facts["system"] == "Darwin"
      tags:
        - macos
        - keyboard

    - name: Inspect application icon permissions
      ansible.builtin.stat:
        path: "/Applications/{{ item.name }}"
        get_checksum: false
      register: application_icon_targets
      loop: "{{ application_icon_files }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - application
        - icons

    - name: Set Application Icons
      ansible.builtin.command:
        argv:
          - fileicon
          - set
          - "/Applications/{{ item.item.name }}"
          - "{{ item.item.icon }}"
      become: "{{ not (item.stat.writeable | default(false)) }}"
      loop: "{{ application_icon_targets.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: application_icons
      changed_when: application_icons.rc == 0
      tags:
        - application
        - icons

    - name: List installed Helm plugins
      ansible.builtin.command:
        argv:
          - helm
          - plugin
          - list
      register: helm_plugins
      changed_when: false
      check_mode: false
      tags:
        - helm
        - install
        - plugin

    - name: Install missing Helm plugins
      ansible.builtin.command:
        argv:
          - helm
          - plugin
          - install
          - "{{ item.url }}"
      changed_when: true
      when: not (helm_plugins.stdout is search('(?m)^' ~ item.name ~ '\\s'))
      loop:
        - name: diff
          url: https://github.com/databus23/helm-diff
        - name: import
          url: https://github.com/jzbruno/helm-import/
      tags:
        - helm
        - install
        - plugin

    - name: Inspect ble.sh checkout
      ansible.builtin.stat:
        path: "{{ ble_sh_dir }}/.git"
      register: ble_sh_git_metadata
      tags:
        - ble.sh
        - git

    # The git module does not recognize linked worktrees as existing repositories.
    - name: Update ble.sh linked worktree
      ansible.builtin.shell: |
        set -eu
        before=$(git -C "$BLE_SH_DIRECTORY" rev-parse HEAD)
        git -C "$BLE_SH_DIRECTORY" fetch --depth 1 origin "$BLE_SH_REVISION"
        git -C "$BLE_SH_DIRECTORY" checkout --detach FETCH_HEAD
        git -C "$BLE_SH_DIRECTORY" submodule update --init --recursive --depth 1
        after=$(git -C "$BLE_SH_DIRECTORY" rev-parse HEAD)
        if [ "$before" != "$after" ]; then
          printf 'updated: ble.sh\n'
        fi
      environment:
        BLE_SH_DIRECTORY: "{{ ble_sh_dir }}"
        BLE_SH_REVISION: "{{ ble_sh_version }}"
      when: ble_sh_git_metadata.stat.isreg | default(false)
      register: ble_sh_worktree_update
      changed_when: "'updated: ble.sh' in ble_sh_worktree_update.stdout"
      tags:
        - ble.sh
        - git

    # This setup intentionally tracks upstream ble.sh updates.
    - name: Clone ble.sh repository
      ansible.builtin.git: # noqa: latest[git]
        dest: "{{ ble_sh_dir }}"
        version: "{{ ble_sh_version }}"
        clone: true
        recursive: true
        depth: 1
        repo: https://github.com/akinomyoga/ble.sh.git
      when: not (ble_sh_git_metadata.stat.isreg | default(false))
      tags:
        - ble.sh
        - git

    - name: Install ble.sh
      ansible.builtin.command:
        argv:
          - gmake
          - -C
          - "{{ ble_sh_dir }}"
          - install
          - "PREFIX={{ setup_home }}/.local"
        creates: "{{ lookup('env', 'HOME') }}/.local/share/blesh/ble.sh"
      tags:
        - ble.sh
        - install

    - name: Ensure local binary directory exists
      ansible.builtin.file:
        path: "~/.local/bin"
        state: directory
        mode: "0755"
      tags:
        - dotfiles
        - setup

    - name: Setup dotfiles (create symbolic links)
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
      with_items:
        - src: "{{ dotfiles_dir }}/bash_profile"
          dest: "~/.bash_profile"
        - src: "{{ dotfiles_dir }}/bashrc"
          dest: "~/.bashrc"
        - src: "{{ dotfiles_dir }}/gitconfig"
          dest: "~/.gitconfig"
        - src: "{{ dotfiles_dir }}/pythonrc"
          dest: "~/.pythonrc"
        - src: "{{ dotfiles_dir }}/tmux.conf"
          dest: "~/.tmux.conf"
        - src: "{{ dotfiles_dir }}/vimrc"
          dest: "~/.vimrc"
        - src: "{{ dotfiles_dir }}/bash_completion"
          dest: "~/.bash_completion"
        - src: "{{ dotfiles_dir }}/blerc"
          dest: "~/.blerc"
        - src: "{{ dotfiles_dir }}/bin/update-bash-completions"
          dest: "~/.local/bin/update-bash-completions"
      tags:
        - dotfiles
        - setup
